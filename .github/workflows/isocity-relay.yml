name: Temporary IsoCity Archive Relay

on:
  push:
    paths:
      - '.github/workflows/isocity-relay.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone exact upstream commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags https://github.com/amilich/isometric-city.git isometric-city
          cd isometric-city
          git checkout --detach f1bbce8a93fae61d2446d1ece50309f26531d987
          test "$(git rev-parse HEAD)" = "f1bbce8a93fae61d2446d1ece50309f26531d987"

      - name: Build exact tracked-source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd isometric-city
          git archive --format=zip --prefix=isometric-city/ HEAD > ../isometric-city-exact-f1bbce8.zip
          cd ..
          sha256sum isometric-city-exact-f1bbce8.zip | tee isometric-city-exact-f1bbce8.zip.sha256
          ls -lh isometric-city-exact-f1bbce8.zip

      - name: Upload relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: isometric-city-exact-clone
          path: |
            isometric-city-exact-f1bbce8.zip
            isometric-city-exact-f1bbce8.zip.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
